services:

  frontend:
    build:
      context: ./client
    container_name: frontend_app
    image: frontend:v1
    ports:
      - "3000:3000"
    networks:
      - test
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: backend_app
    image: backend:v1
    ports:
      - "5000:80"
    networks:
      - test
    depends_on:
      - db

  db:
    image: postgres:14
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_HOST}
    networks:
      - test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  test:

volumes:
  postgres_data:
